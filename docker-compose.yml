version: '3.8'

services:
  telegram-ocr-bot:
    build: .
    container_name: telegram_ocr_bot
    restart: always
    env_file:
      - .env
    volumes:
      # Persistent storage for SQLite database
      - ./bot_data:/app/data
    environment:
      - DB_PATH=/app/data/database.db
      - TEMP_DIR=/app/temp
